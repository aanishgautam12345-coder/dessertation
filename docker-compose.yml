version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobmatch_db
    environment:
      POSTGRES_DB: jobmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password_here}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
