{% extends "base.html" %}{% block title %}Create job - JobMatch{% endblock %}{% block content %}
<div class="max-w-[800px] mx-auto px-4 py-6"><h1 class="text-2xl font-bold mb-4">Create new job listing</h1><form method="POST" class="li-card p-6 space-y-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title *<input class="li-input" name="title" required placeholder="e.g. Senior Python Developer"></label><label>Company<input class="li-input" name="company" placeholder="e.g. Acme Corp"></label><label>Description<textarea class="li-input" rows="8" name="description" placeholder="Full job description"></textarea></label><label>Requirements<textarea class="li-input" rows="3" name="requirements" placeholder="Required qualifications"></textarea></label><label>Responsibilities<textarea class="li-input" rows="3" name="responsibilities" placeholder="Key responsibilities"></textarea></label><div class="grid sm:grid-cols-2 gap-3"><label>City<input class="li-input" name="location_city" placeholder="e.g. London"></label><label>Country<input class="li-input" name="location_country" placeholder="e.g. UK"></label></div><label class="flex gap-2"><input type="checkbox" name="remote"> Remote</label><select class="li-input" name="category"><option value="">Select category</option>{% for item in categories %}<option>{{ item }}</option>{% endfor %}</select><div class="grid sm:grid-cols-2 gap-3"><label>Job type<input class="li-input" name="job_type" placeholder="e.g. full-time"></label><label>Experience level<input class="li-input" name="experience_level" placeholder="e.g. senior"></label></div><div class="grid sm:grid-cols-2 gap-3"><label>Minimum salary<input class="li-input" type="number" min="0" step="0.01" name="salary_min" placeholder="e.g. 50000"></label><label>Maximum salary<input class="li-input" type="number" min="0" step="0.01" name="salary_max" placeholder="e.g. 70000"></label></div><div class="grid sm:grid-cols-2 gap-3"><label>Salary currency<input class="li-input" name="salary_currency" placeholder="e.g. GBP"></label><label>Salary period<input class="li-input" name="salary_period" placeholder="e.g. annual"></label></div><label>Skills (comma-separated)<input class="li-input" name="skills" placeholder="e.g. python, django, postgresql"></label><label>URL<input class="li-input" name="url" placeholder="https://..."></label><button class="li-btn-primary">Create job</button><a href="{{ url_for('admin.jobs') }}" class="li-btn-outline ml-2">Cancel</a></form></div>{% endblock %}
